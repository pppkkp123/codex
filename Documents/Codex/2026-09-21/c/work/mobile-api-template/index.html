<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CGU AI Gateway Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <div class="eyebrow">CGU AI Gateway mobile bridge</div>
        <h1>手機共用同一組 Gateway key</h1>
        <p class="lede">這個頁面會透過你的後端呼叫 CGU Gateway，手機只碰到你的站，不會直接暴露 key。</p>

        <section class="panel">
          <h2>文字聊天</h2>
          <label class="field">
            <span>Model</span>
            <input id="chat-model" value="gpt-4.1-mini" />
          </label>
          <label class="field">
            <span>Message</span>
            <textarea id="message" rows="5" placeholder="輸入你想問的內容"></textarea>
          </label>
          <button id="send-chat">Send</button>
          <div class="result">
            <div class="result-label">Reply</div>
            <pre id="chat-output">尚未送出</pre>
          </div>
        </section>

        <section class="panel">
          <h2>上傳圖片問答</h2>
          <label class="field">
            <span>Model</span>
            <input id="vision-model" value="gpt-4.1-mini" />
          </label>
          <label class="field">
            <span>問題</span>
            <textarea id="vision-message" rows="4" placeholder="例如：這張圖裡有什麼？"></textarea>
          </label>
          <label class="field">
            <span>圖片</span>
            <input id="vision-file" type="file" accept="image/*" />
          </label>
          <img id="vision-preview" class="preview hidden" alt="Image preview" />
          <button id="send-vision">Analyze image</button>
          <div class="result">
            <div class="result-label">Reply</div>
            <pre id="vision-output">尚未送出</pre>
          </div>
        </section>

        <section class="panel">
          <h2>生成圖片</h2>
          <label class="field">
            <span>Model</span>
            <input id="image-model" value="gpt-image-1" />
          </label>
          <label class="field">
            <span>Prompt</span>
            <textarea id="image-prompt" rows="4" placeholder="例如：一隻坐在窗邊的橘貓，夜晚霓虹光"></textarea>
          </label>
          <label class="field">
            <span>Size</span>
            <input id="image-size" value="1024x1024" />
          </label>
          <button id="send-image">Generate image</button>
          <div class="result">
            <div class="result-label">Generated image</div>
            <img id="image-preview" class="preview hidden" alt="Generated preview" />
            <pre id="image-output">尚未送出</pre>
          </div>
        </section>

        <p class="hint">如果模型名稱不確定，可以先開 <code>/api/models</code> 看學校 Gateway 支援哪些模型。</p>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
