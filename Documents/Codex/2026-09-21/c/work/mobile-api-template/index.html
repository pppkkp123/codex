<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CGU AI Gateway Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <div class="eyebrow">CGU AI Gateway mobile bridge</div>
        <h1>一個輸入區完成所有事</h1>
        <p class="lede">同一個提示框可以拿來問文字、分析圖片，或直接拿來生成圖片；手機操作會比較順。</p>

        <section class="panel compact">
          <label class="field">
            <span>Mode</span>
            <select id="mode">
              <option value="chat">文字問答</option>
              <option value="vision">圖片問答</option>
              <option value="image">生成圖片</option>
            </select>
          </label>

          <label class="field">
            <span>Prompt / Question</span>
            <textarea id="prompt" rows="5" placeholder="輸入你想問的內容，或用來描述要生成的圖片"></textarea>
          </label>

          <label class="field" id="image-field">
            <span>圖片（圖片問答時使用）</span>
            <input id="image-file" type="file" accept="image/*" />
          </label>
          <img id="image-preview" class="preview hidden" alt="Image preview" />

          <div class="row">
            <label class="field">
              <span>Chat / Vision Model</span>
              <input id="text-model" value="gpt-4.1-mini" />
            </label>
            <label class="field">
              <span>Image Model</span>
              <input id="image-model" value="gpt-image-1" />
            </label>
          </div>

          <div class="row">
            <label class="field">
              <span>Image Size</span>
              <input id="image-size" value="1024x1024" />
            </label>
          </div>

          <div class="actions">
            <button id="send-chat" data-label="送出文字">送出文字</button>
            <button id="send-vision" data-label="分析圖片">分析圖片</button>
            <button id="send-image" data-label="生成圖片">生成圖片</button>
          </div>

          <div class="result">
            <div class="result-label">Result</div>
            <img id="generated-preview" class="preview hidden" alt="Generated preview" />
            <pre id="output">尚未送出</pre>
          </div>
        </section>

        <p class="hint">如果模型名稱不確定，可以先開 <code>/api/models</code> 看學校 Gateway 支援哪些模型。</p>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
